
# Deploy CampusTrace Backend to Azure App Service

name: Deploy CampusTrace Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_app-campustrace-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campustrace-backend-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campustrace-backend
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: campustrace-backend
          path: .

      - name: Verify Backend Entry Point
        run: |
          test -f server.js
          test -f app.js
          test -f package.json
          echo "Backend files verified successfully."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6A8349A4F1124B2EB8A39B541CB283D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C514CBF79799498C80E50E09244EAF74 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C07C60926312489D8AA9848A7FD4084D }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-campustrace-api
          slot-name: Production
          package: .
